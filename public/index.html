<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json" />
    <title>Gwiji Linux Workspace IDE</title>
    <link rel="stylesheet" href="https://jsdelivr.net" />
    <style>
        body { background-color: #0b0f19; margin: 0; padding: 10px; font-family: monospace; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; color: #f8fafc; }
        #settings-bar { display: flex; justify-content: space-between; align-items: center; background: #090d16; border: 1px solid #1f293d; border-radius: 8px 8px 0 0; padding: 8px 12px; }
        #theme-select { background: #1e293b; color: #f8fafc; border: 1px solid #334155; padding: 4px 8px; border-radius: 4px; font-family: monospace; }
        #main-workspace { display: flex; flex-grow: 1; background: #020617; border: 1px solid #1f293d; border-top: none; border-radius: 0 0 8px 8px; overflow: hidden; }
        #file-sidebar { width: 200px; background: #070a12; border-right: 1px solid #1f293d; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .sidebar-title { font-size: 11px; font-weight: bold; color: #64748b; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .file-item { cursor: pointer; padding: 4px 6px; border-radius: 4px; font-size: 13px; display: flex; gap: 6px; overflow: hidden; text-overflow: ellipsis; }
        .file-item:hover { background: #1e293b; }
        .dir-item { color: #38bdf8; font-weight: bold; }
        #terminal-column { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
        #terminal-container { flex-grow: 1; padding: 10px; }
        #toolbar { display: flex; background: #0f172a; border-bottom: 1px solid #1f293d; padding: 5px; gap: 5px; overflow-x: auto; white-space: nowrap; }
        .btn { min-width: 48px; background: #1e293b; color: #f8fafc; border: none; padding: 8px; font-size: 12px; font-weight: bold; border-radius: 4px; font-family: monospace; cursor: pointer; }
        .btn.active-toggle { background: #0284c7 !important; }
        #macro-sidebar { width: 180px; background: #070a12; border-left: 1px solid #1f293d; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .macro-btn { background: #0f172a; color: #34d399; border: 1px solid #10b981; padding: 8px; font-size: 12px; font-family: monospace; border-radius: 6px; text-align: left; cursor: pointer; width: 100%; }
        .macro-btn:active { background: #064e3b; }
        @media(max-width: 600px) { #file-sidebar, #macro-sidebar { display: none; } }
    </style>
</head>
<body>
    <div id="settings-bar">
        <span>🛠️ Node Multi-Tool Dashboard</span>
        <select id="theme-select" onchange="changeTheme(this.value)">
            <option value="termux">Classic Termux</option>
            <option value="matrix">Matrix Green</option>
            <option value="cyberpunk">Cyberpunk Neon</option>
            <option value="ubuntu">Ubuntu Purple</option>
        </select>
    </div>
    <div id="main-workspace">
        <div id="file-sidebar">
            <div class="sidebar-title">📁 Files</div>
            <div id="file-tree-container">Loading workspace...</div>
        </div>
        <div id="terminal-column">
            <div id="toolbar">
                <button class="btn" onclick="sendKey('ESC')">ESC</button>
                <button class="btn" onclick="sendKey('TAB')">TAB</button>
                <button id="btn-ctrl" class="btn" onclick="toggleModifier('CTRL')">CTRL</button>
                <button id="btn-alt" class="btn" onclick="toggleModifier('ALT')">ALT</button>
                <button class="btn" onclick="sendKey('UP')">↑</button>
                <button class="btn" onclick="sendKey('DOWN')">↓</button>
                <button class="btn" onclick="sendKey('LEFT')">←</button>
                <button class="btn" onclick="sendKey('RIGHT')">→</button>
            </div>
            <div id="terminal-container"></div>
        </div>
        <div id="macro-sidebar">
            <div class="sidebar-title">⚡ Quick Run</div>
            <button class="macro-btn" onclick="triggerMacro('ls -la')">📋 List All Files</button>
            <button class="macro-btn" onclick="triggerMacro('node -v && npm -v')">🤖 Check Versions</button>
            <button class="macro-btn" onclick="triggerMacro('python3 --version')">🐍 Python Check</button>
            <button class="macro-btn" onclick="triggerMacro('top')">📊 System Monitor</button>
            <button class="macro-btn" onclick="triggerMacro('clear')">🧹 Clear Screen</button>
        </div>
    </div>
    <script src="https://jsdelivr.net"></script>


    <script>
        const themes = {
            termux: { background: '#020617', foreground: '#f8fafc', cursor: '#f8fafc' },
            matrix: { background: '#000000', foreground: '#00ff00', cursor: '#00ff00' },
            cyberpunk: { background: '#1a0826', foreground: '#00ffff', cursor: '#ff007f' },
            ubuntu: { background: '#300a24', foreground: '#ffffff', cursor: '#dfdbd2' }
        };

        const ws = new WebSocket(`ws://${window.location.host}`);
        const term = new Terminal({ cursorBlink: true, theme: themes.termux, fontSize: 13, fontFamily: 'monospace' });
        term.open(document.getElementById('terminal-container'));

        let isCtrlActive = false;
        let isAltActive = false;

        term.onKey(e => {
            let char = e.key;
            if (isCtrlActive) {
                const code = char.toLowerCase().charCodeAt(0) - 96;
                if (code >= 1 && code <= 26) char = String.fromCharCode(code);
                clearModifiers();
            } else if (isAltActive) {
                char = '\x1b' + char;
                clearModifiers();
            }
            ws.send(JSON.stringify({ type: 'input', data: char }));
        });

        ws.onmessage = (event) => {
            term.write(event.data);
            loadFiles();
        };

        function loadFiles(dirPath = '') {
            fetch(`/api/files?path=${encodeURIComponent(dirPath)}`)
                .then(res => res.json())
                .then(data => {
                    const container = document.getElementById('file-tree-container');
                    container.innerHTML = '';
                    if (data.currentDir !== '/') {
                        const upItem = document.createElement('div');
                        upItem.className = 'file-item dir-item';
                        upItem.innerText = '📁 .. (Go Back)';
                        upItem.onclick = () => {
                            const parentPath = data.currentDir.substring(0, data.currentDir.lastIndexOf('/')) || '/';
                            loadFiles(parentPath);
                        };
                        container.appendChild(upItem);
                    }
                    data.files.forEach(file => {
                        const div = document.createElement('div');
                        div.className = `file-item ${file.isDirectory ? 'dir-item' : ''}`;
                        div.innerText = (file.isDirectory ? '📁 ' : '📄 ') + file.name;
                        div.onclick = () => {
                            if (file.isDirectory) {
                                loadFiles(file.path);
                            } else {
                                triggerMacro(`nano ${file.path}`);
                            }
                        };
                        container.appendChild(div);
                    });
                }).catch(() => {});
        }

        function triggerMacro(commandString) {
            ws.send(JSON.stringify({ type: 'command', data: commandString }));
            term.focus();
        }

        function toggleModifier(type) {
            if (type === 'CTRL') { isCtrlActive = !isCtrlActive; isAltActive = false; }
            else if (type === 'ALT') { isAltActive = !isAltActive; isCtrlActive = false; }
            updateVisualStates();
            term.focus();
        }
        function clearModifiers() { isCtrlActive = false; isAltActive = false; updateVisualStates(); }
        function updateVisualStates() {
            document.getElementById('btn-ctrl').classList.toggle('active-toggle', isCtrlActive);
            document.getElementById('btn-alt').classList.toggle('active-toggle', isAltActive);
        }
        function sendKey(keyType) {
            let code = '';
            if (keyType === 'ESC') code = '\x1b';
            else if (keyType === 'TAB') code = '\t';
            else if (keyType === 'UP') code = '\x1b[A';
            else if (keyType === 'DOWN') code = '\x1b[B';
            else if (keyType === 'RIGHT') code = '\x1b[C';
            else if (keyType === 'LEFT') code = '\x1b[D';
            ws.send(JSON.stringify({ type: 'input', data: code }));
            clearModifiers();
            term.focus();
        }
        function changeTheme(themeKey) {
            if (themes[themeKey]) {
                term.options.set('theme', themes[themeKey]);
                document.getElementById('main-workspace').style.backgroundColor = themes[themeKey].background;
            }
            term.focus();
        }
        setTimeout(() => loadFiles(), 800);
    </script>
        <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(()=>{});
        }
    </script>
</body>
</html>
